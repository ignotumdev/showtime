<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = "system";
        try {
          const stored = localStorage.getItem("showtime.theme");
          if (stored === "light" || stored === "dark") preference = stored;
        } catch {}
        const dark =
          preference === "dark" ||
          (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#0a0a0a" : "#ffffff";
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Showtime" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="Showtime" />
    <meta
      name="description"
      content="Reliable show and soundcheck coordination for live sound teams."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Showtime</title>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
